<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="timer-card" aria-label="Pomodoro timer">
      <svg class="progress-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="progress-ring__background" cx="100" cy="100" r="90" />
        <circle class="progress-ring__foreground" cx="100" cy="100" r="90" id="foregroundCircle" />
      </svg>

      <div class="timer-display">
        <p class="timer-label" id="phaseLabel">Work</p>
        <p class="timer-value" id="timerValue">25:00</p>
      </div>

      <div class="controls">
        <button id="startButton" type="button">Start</button>
        <button id="pauseButton" type="button">Pause</button>
        <button id="resumeButton" type="button">Resume</button>
        <button id="resetButton" type="button">Reset</button>
      </div>

      <div class="session-info">
        <p>Sessions completed: <span id="sessionCount">0</span></p>
        <button id="resetSessionsButton" type="button" style="margin-top: 8px;">Reset sessions</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
